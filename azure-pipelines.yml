trigger:
- main
pool:
  vmImage: windows-latest
stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: Build
    displayName: Build Job
    steps:
    - checkout: self
    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
        packageType: sdk
        version: 10.0.x
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: EmailService\*.csproj
    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: EmailService\*.csproj
        arguments: --configuration Release
    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: EmailService\*.csproj
        arguments: --configuration Release --output published
        zipAfterPublish: true
    - task: PublishBuildArtifacts@1
      displayName: Drop
      inputs:
        PathtoPublish: published
        ArtifactName: drop
        publishLocation: Container
- stage: Deploy
  displayName: Deploy Stage
  jobs:
  - job: Deploy
    displayName: Deploy Job
    steps:
    - download: current
      artifact: drop
    - task: AzureFunctionApp@2
      displayName: Deploy to Azure Function App
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        appType: $(APP_TYPE)
        appName: $(APP_NAME)
        package: $(Pipeline.Workspace)\drop\*.zip
        resourceGroupName: $(AZURE_RESOURCE_GROUP)
        deploymentMethod: auto
- stage: Sync
  displayName: 'Sync to GitHub'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: SyncJob
    steps:
    - checkout: self
      persistCredentials: true
      fetchDepth: 0
    - bash: |
        git config --global user.email "pipeline@devops.local"
        git config --global user.name "DevOps Pipeline"
        
        git remote add github https://$MAPPED_PAT@github.com/$(GitHubRepo)
        git push github HEAD:refs/heads/$(Build.SourceBranchName) --force
      displayName: 'Push Mirror to GitHub'
      env:
        MAPPED_PAT: $(GITHUB_PAT)  